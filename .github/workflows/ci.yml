name: CI

# 回归兜底：覆盖率脚本单次执行后端 60 个测试文件（1822 项）+ 前端 22 套单元测试（181 项）
# + tsc --noEmit + Expo lint，不再在 CI 里重复跑同一批测试。
# 触发范围：main 的 push、针对 main 的 PR、手动触发；同一 PR 不会因 push+PR 双跑。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 全量测试与类型检查
    # 固定 24.04 而非 ubuntu-latest：GitHub 已公告 ubuntu-latest 将于 2026-10-19
    # 迁移到 Ubuntu 26，避免 runner 大版本切换带来的意外。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions v5 起使用 Node 24 运行时，避开 GitHub 对 Node 20 action 的弃用告警。
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与 package.json engines.node（>=22）和仓库根 .nvmrc 保持同一版本线。
          node-version: '22'
          cache: 'npm'

      # 仓库跟踪了 package-lock.json（lockfileVersion 3），用 npm ci 保证依赖可复现；
      # setup-node 的 npm 缓存也依赖该 lockfile 存在。改依赖后记得重新生成 lockfile。
      - name: 安装依赖（npm ci）
        run: npm ci

      # 静态兜底：api.test.js 里有 /memory/clear、/history/clear，
      # 一旦去掉数据目录隔离就会清空真实 server/data（历史事故，见 AGENTS.md）。
      - name: 隔离守卫（静态）：api.test.js 必须设置 BLUEBIRD_DATA_DIR
        run: |
          if ! grep -q "BLUEBIRD_DATA_DIR" tests/api.test.js; then
            echo "::error::tests/api.test.js 未设置 BLUEBIRD_DATA_DIR——它会清空真实 server/data。参见 AGENTS.md「Tests」小节"
            exit 1
          fi

      - name: TypeScript 类型检查（前端 strict）
        run: npx tsc --noEmit

      # 静态检查不依赖测试是否覆盖；Expo 项目用统一的 expo lint 入口。
      - name: ESLint（Expo lint）
        run: npm run lint

      # 固定评测先跑；随后覆盖率脚本单次执行全部后端与 Jest。
      - name: 语义检索评测（固定集，Recall/MRR/隔离/预算）
        run: node tests/memory-semantic-eval.js --assert

      - name: 统一检索评测（固定语料，Recall/MRR）
        run: node tests/retrieval-eval.js --assert

      - name: 测试覆盖验证（自测）
        run: node scripts/verify-test-coverage.test.js

      # 文档计数自测：确认 sync-doc-counts 脚本自身的派生与锚点替换逻辑是对的，
      # 否则下面那次 --check 的绿灯没有意义。
      - name: 文档计数同步（自测）
        run: node scripts/sync-doc-counts.test.js

      # 文档计数单一来源门禁：AGENTS.md / README.md / docs/* 与 CI 注释里的测试
      # 计数必须等于 scripts/test-coverage-baseline.json 里的值，否则失败。
      - name: 文档计数与基线一致
        run: node scripts/sync-doc-counts.js --check

      # 后端能力登记门禁：每条后端路由都必须落在登记册里；标了 ui 的能力必须有
      # 前端消费者，标了 api-only 的能力必须确实没有前端消费者。
      - name: API 能力登记一致
        run: node scripts/verify-api-capabilities.js

      # 单次执行全部后端文件（node:test + 自定义 runner）与 Jest，并按逐文件
      # 运行时计数对账；这里不再重复跑上面已删除的同类步骤。
      - name: 全量测试 + 覆盖率对账（单次执行）
        run: node scripts/verify-test-coverage.js

      # 运行时隔离守卫：全新 checkout 里不存在 server/data（被 .gitignore 排除），
      # 全部测试都使用临时数据目录，跑完后它也不该出现。出现了即为隔离失效——
      # 这比静态 grep 更强，校验的是实际行为而非代码长相。
      - name: 隔离守卫（运行时）：测试不得在仓库内留下 server/data
        run: |
          if [ -e server/data ]; then
            echo "::error::测试在仓库内创建了 server/data——数据隔离失效，参见 AGENTS.md「Tests」小节"
            ls -la server/data
            exit 1
          fi
